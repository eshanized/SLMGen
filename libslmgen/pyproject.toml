[project]
name = "libslmgen"
version = "3.0.0"
description = "SLMGEN Backend - Small Language Model Generator"
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "Eshan Roy", email = "eshanized@proton.me" }
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
]
ignore = [
    "E501",  # line too long
    "E402",  # module level import not at top (needed for dotenv loading)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E402"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
